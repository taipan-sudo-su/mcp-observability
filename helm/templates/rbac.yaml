{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-observability.fullname" . }}
  labels:
    {{- include "mcp-observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp-observability.fullname" . }}
  labels:
    {{- include "mcp-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcp-observability.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-observability.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
