{{- if .Values.auth.apiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-observability.fullname" . }}-auth
  labels:
    {{- include "mcp-observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_API_KEYS: {{ .Values.auth.apiKeys | quote }}
  {{- if .Values.backends.grafanaToken }}
  GRAFANA_TOKEN: {{ .Values.backends.grafanaToken | quote }}
  {{- end }}
{{- end }}
